name: Validate metrics case
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild dataset and landing page
        run: |
          python src/build.py
          python src/build_site.py
      - name: Validate computations and presentation
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible public outputs
        run: |
          git diff --ignore-space-at-eol --exit-code -- index.html data/fictional_tickets.csv data/analysis.json
